# ============================================================
# Veroeffentlicht Sproutvale auf itch.io (https://venrablossom.itch.io/sproutvale)
#
# Startet NUR, wenn ein Versions-Tag hochgeladen wird (z.B. v0.2.0) oder per Hand
# (GitHub > Actions > "Auf itch.io veroeffentlichen" > Run workflow). Normale Aenderungen laden nichts hoch.
#
# Einmalig noetig: itch.io > Settings > API keys > Schluessel erzeugen und auf GitHub unter
# Settings > Secrets and variables > Actions als "BUTLER_API_KEY" eintragen.
# ============================================================
name: Auf itch.io veroeffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakete installieren
        working-directory: desktop-app
        run: npm ci

      - name: Windows-Version bauen
        working-directory: desktop-app
        run: npm run release

      - name: butler (Upload-Programm von itch.io) holen
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler

      - name: Auf itch.io hochladen
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Versionsnummer aus dem Tag (v0.2.0 -> 0.2.0), sonst aus desktop-app/package.json
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.ref_type }}" -ne "tag") { $version = (Get-Content desktop-app/package.json | ConvertFrom-Json).version }
          ./butler/butler.exe push desktop-app/dist-release/Sproutvale venrablossom/sproutvale:windows --userversion $version
