name: Auf itch.io veroeffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakete installieren
        working-directory: desktop-app
        run: npm ci

      - name: Schluessel fuer den Tresor
        working-directory: desktop-app
        shell: pwsh
        env:
          GEHEIM: ${{ secrets.SPROUTVALE_GEHEIM }}
        run: |
          if (-not $env:GEHEIM) { throw "Secret SPROUTVALE_GEHEIM fehlt (Inhalt von desktop-app/geheim.txt)" }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "geheim.txt"), $env:GEHEIM.Trim())

      - name: Windows-Version bauen
        working-directory: desktop-app
        run: npm run release

      - name: butler (Upload-Programm von itch.io) holen
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler

      - name: Auf itch.io hochladen
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.ref_type }}" -ne "tag") { $version = (Get-Content desktop-app/package.json | ConvertFrom-Json).version }
          ./butler/butler.exe push desktop-app/dist-release/Sproutvale venrablossom/sproutvale:windows --userversion $version
